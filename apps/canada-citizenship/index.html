<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canada Citizenship 2027 · Citoyenneté canadienne 2027</title>
<!-- Language doorway. The pages live at /en/ and /fr/ (since 28 Oct 2026);
     this address sends French browsers to /fr/ and everyone else to /en/,
     keeping the query string and #anchor. Without JavaScript it falls back
     to English, and the two links below stay visible. -->
<script>
(function () {
  var first = (navigator.languages && navigator.languages[0]) || navigator.language || '';
  var lang = /^fr\b/i.test(first) ? 'fr/' : 'en/';
  location.replace('/apps/canada-citizenship/' + lang + location.search + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/apps/canada-citizenship/en/"></noscript>
<link rel="canonical" href="https://macwanapps.com/apps/canada-citizenship/en/">
<link rel="alternate" hreflang="en-CA" href="https://macwanapps.com/apps/canada-citizenship/en/">
<link rel="alternate" hreflang="fr-CA" href="https://macwanapps.com/apps/canada-citizenship/fr/">
<link rel="alternate" hreflang="x-default" href="https://macwanapps.com/apps/canada-citizenship/en/">
<link rel="icon" type="image/png" sizes="32x32" href="/images/ma-favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/ma-apple-touch-icon.png">
<style>
  :root { --bg: #faf3f1; --card: #ffffff; --ink: #1b1b1b; --muted: #5f5d62; --accent: #B8202D; --line: rgba(0,0,0,0.08); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141213; --card: #1f1c1d; --ink: #f4f1f1; --muted: #b3aeb0; --accent: #ff6b75; --line: rgba(255,255,255,0.10); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { width: 100%; max-width: 380px; text-align: center; background: var(--card);
         border: 1px solid var(--line); border-radius: 24px; padding: 32px 24px; }
  img { border-radius: 18px; }
  h1 { font-size: 20px; margin: 16px 0 4px; }
  p { margin: 0 0 24px; color: var(--muted); font-size: 15px; }
  nav { display: grid; gap: 10px; }
  a { display: block; padding: 13px 16px; border-radius: 14px; font-weight: 600; text-decoration: none;
      border: 1.5px solid var(--accent); color: var(--accent); }
  a:first-child { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { a:first-child { color: #141213; } }
</style>
</head>
<body>
<main>
  <img src="/images/canada-citizenship-icon.webp" alt="" width="72" height="72">
  <h1>Canada Citizenship 2027</h1>

    <a href="/apps/canada-citizenship/en/" hreflang="en-CA">English</a>
    <a href="/apps/canada-citizenship/fr/" hreflang="fr-CA" lang="fr-CA">Français</a>
  </nav>
</main>
</body>
</html>
